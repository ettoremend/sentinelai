services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel_dev_only@db:5432/sentinelai
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_only
    ports:
      - "5432:5432"
