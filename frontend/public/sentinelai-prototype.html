<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentinelAI - Intelligent Cloud AppSec Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #090d16;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.15);
        }

        .terminal-text {
            font-family: 'Fira Code', monospace;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(9, 13, 22, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">

    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="navigateTo('home')">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </div>
            <div>
                <span class="text-lg font-extrabold tracking-wide text-white">Sentinel<span class="text-indigo-400">AI</span></span>
                <span class="block text-[10px] text-slate-400 font-mono tracking-widest uppercase">Cloud AppSec v2.4</span>
            </div>
        </div>
        <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
            <a href="#" onclick="navigateTo('home')" class="hover:text-indigo-400 transition">Platform</a>
            <a href="#" onclick="navigateTo('lab')" class="hover:text-indigo-400 transition flex items-center gap-1.5"><i class="fa-solid fa-flask text-xs text-indigo-400"></i> SentinelLab</a>
            <a href="#" onclick="navigateTo('architecture')" class="hover:text-indigo-400 transition">Cloud Architecture</a>
            <a href="#" onclick="navigateTo('docs')" class="hover:text-indigo-400 transition">TCC Docs</a>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openDemoScan()" class="px-4 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-500/30 flex items-center gap-2">
                <i class="fa-solid fa-play text-[10px]"></i> Quick Demo Scan
            </button>
        </div>
    </nav>

    <main id="app-container" class="container mx-auto px-4 sm:px-6 py-8 min-h-[calc(100vh-80px)]">
        <!-- Dynamic views rendered via JavaScript -->
    </main>

    <script>
        // --- APPLICATION STATE ---
        const state = {
            currentView: 'home', // 'home', 'scanning', 'fixing', 'dashboard', 'lab', 'architecture', 'docs'
            targetUrl: 'https://sentinellab.local/api/v1',
            isFixed: false,
            selectedVulnId: 'vuln-sql',
            activeTab: 'technical',
            scanLogs: [],
            fixLogs: []
        };

        // --- MOCK DATA ---
        const vulnerabilitiesData = [
            {
                id: 'vuln-sql',
                type: 'SQL Injection (SQLi)',
                severity: 'CRITICAL',
                severityColor: 'text-red-400',
                severityBg: 'bg-red-500/10 border-red-500/20',
                endpoint: '/api/v1/auth/login',
                parameter: 'username',
                cwe: 'CWE-89',
                confidence: '99%',
                ai_beginner: 'O formulário de login confia diretamente nos dados digitados pelo usuário. Um atacante pode digitar caracteres especiais para enganar o sistema e acessar a conta de qualquer usuário sem saber a senha.',
                ai_technical: 'O parâmetro de entrada "username" é concatenado diretamente na string de consulta SQL sem parametrização ou escape adequado na camada de persistência. Permite alteração lógica da query subjacente.',
                ai_remediation: `// ❌ CÓDIGO VULNERÁVEL (Concatenação Direta)
String query = "SELECT * FROM users WHERE username = '" + username + "'";
Statement stmt = conn.createStatement();
ResultSet rs = stmt.executeQuery(query);

// ✅ CÓDIGO CORRIGIDO PELO SENTINELAI (Prepared Statements)
String query = "SELECT * FROM users WHERE username = ?";
PreparedStatement pstmt = conn.prepareStatement(query);
pstmt.setString(1, username);
ResultSet rs = pstmt.executeQuery();`
            },
            {
                id: 'vuln-xss',
                type: 'Stored Cross-Site Scripting (XSS)',
                severity: 'HIGH',
                severityColor: 'text-amber-400',
                severityBg: 'bg-amber-500/10 border-amber-500/20',
                endpoint: '/dashboard/profile/bio',
                parameter: 'bio_description',
                cwe: 'CWE-79',
                confidence: '95%',
                ai_beginner: 'O site aceita textos formatados em HTML salvos no perfil do usuário e os exibe para outros visitantes sem limpeza prévia. Scripts maliciosos podem roubar sessões de quem visualizar a página.',
                ai_technical: 'Identificado Stored XSS onde payloads JavaScript injetados na bio são persistidos no banco de dados e refletidos no DOM do cliente através de renderização insegura (ex: dangerouslySetInnerHTML).',
                ai_remediation: `// ❌ CÓDIGO VULNERÁVEL (React / DOM)
<div dangerouslySetInnerHTML={{ __html: userBio }} />

// ✅ CÓDIGO CORRIGIDO PELO SENTINELAI (Sanitização Robusta)
import DOMPurify from 'dompurify';

const safeBio = DOMPurify.sanitize(userBio);
<div dangerouslySetInnerHTML={{ __html: safeBio }} />
// Ou utilize renderização padrão de texto do framework:
<div>{userBio}</div>`
            },
            {
                id: 'vuln-headers',
                type: 'Missing Security Headers (HSTS & CSP)',
                severity: 'MEDIUM',
                severityColor: 'text-blue-400',
                severityBg: 'bg-blue-500/10 border-blue-500/20',
                endpoint: 'Global Response Headers',
                parameter: 'HTTP Response',
                cwe: 'CWE-693',
                confidence: '100%',
                ai_beginner: 'O servidor não envia instruções fundamentais de segurança para o navegador do usuário, deixando a aplicação vulnerável a ataques de interceptação e carregamento de scripts externos não autorizados.',
                ai_technical: 'Ausência dos cabeçalhos HTTP Content-Security-Policy (CSP), Strict-Transport-Security (HSTS) e X-Content-Type-Options na resposta do servidor.',
                ai_remediation: `// ✅ CÓDIGO CORRIGIDO (Node.js / Express com Helmet)
const express = require('express');
const helmet = require('helmet');
const app = express();

// Ativa automaticamente o conjunto de cabeçalhos recomendados pela OWASP
app.use(helmet());

app.use(
  helmet.contentSecurityPolicy({
    directives: {
      defaultSrc: ["'self'"],
      scriptSrc: ["'self'"],
    },
  })
);`
            },
            {
                id: 'vuln-sca',
                type: 'Vulnerable Third-Party Dependency (SCA)',
                severity: 'MEDIUM',
                severityColor: 'text-yellow-400',
                severityBg: 'bg-yellow-500/10 border-yellow-500/20',
                endpoint: '/package.json',
                parameter: 'lodash@4.17.15',
                cwe: 'CWE-1357',
                confidence: '98%',
                ai_beginner: 'O projeto utiliza uma biblioteca de código aberto desatualizada que possui falhas de segurança conhecidas publicamente.',
                ai_technical: 'A biblioteca Lodash versão 4.17.15 possui vulnerabilidade conhecida de Prototype Pollution (CVE-2020-8203).',
                ai_remediation: `# Execute no terminal do projeto para atualizar a dependência:
npm install lodash@latest --save

# Ou atualize manualmente no package.json:
"dependencies": {
  "lodash": "^4.17.21"
}`
            }
        ];

        // --- NAVIGATION & ROUTING ---
        function navigateTo(view) {
            state.currentView = view;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openDemoScan() {
            state.targetUrl = 'https://sentinellab.local/api/v1';
            state.currentView = 'scanning';
            state.scanLogs = [];
            render();
            runScanSimulation();
        }

        // --- RENDER MASTER FUNCTION ---
        function render() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            switch (state.currentView) {
                case 'home':
                    container.innerHTML = renderHomeView();
                    break;
                case 'scanning':
                    container.innerHTML = renderTerminalView('Iniciando Análise de Segurança', 'fa-shield-virus text-indigo-400', state.scanLogs);
                    break;
                case 'fixing':
                    container.innerHTML = renderTerminalView('Aplicando Plano de Correção IA', 'fa-wand-magic-sparkles text-emerald-400', state.fixLogs);
                    break;
                case 'dashboard':
                    container.innerHTML = renderDashboardView();
                    break;
                case 'lab':
                    container.innerHTML = renderLabView();
                    break;
                case 'architecture':
                    container.innerHTML = renderArchitectureView();
                    break;
                case 'docs':
                    container.innerHTML = renderDocsView();
                    break;
                default:
                    container.innerHTML = renderHomeView();
            }
        }

        // --- VIEW 1: HOME PAGE ---
        function renderHomeView() {
            return `
                <div class="max-w-6xl mx-auto pt-8 pb-16 animate-fade-in">
                    <!-- Hero Section -->
                    <div class="text-center max-w-3xl mx-auto mb-16">
                        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-panel text-indigo-300 text-xs font-semibold mb-6 border-indigo-500/30 shadow-[0_0_20px_rgba(99,102,241,0.2)]">
                            <i class="fa-solid fa-sparkles text-indigo-400"></i> Plataforma Inteligente em Nuvem para TCC & AppSec
                        </div>
                        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight">
                            Segurança Web Baseada em <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-cyan-300 to-emerald-400">Inteligência Artificial</span>
                        </h1>
                        <p class="text-slate-400 text-base sm:text-lg mb-8 leading-relaxed">
                            Combine scanners tradicionais (DAST/SAST/SCA), modelos de linguagem (LLM) e arquitetura RAG para detectar, priorizar e corrigir vulnerabilidades em aplicações web em tempo recorde.
                        </p>

                        <!-- URL Input Card -->
                        <div class="glass-panel p-2 rounded-2xl flex flex-col sm:flex-row items-center gap-2 border-slate-700 shadow-2xl">
                            <div class="flex items-center px-4 py-3 w-full sm:w-auto flex-grow">
                                <i class="fa-solid fa-globe text-slate-500 mr-3"></i>
                                <input type="text" id="home-url-input" value="${state.targetUrl}" 
                                    class="w-full bg-transparent border-none outline-none text-white text-sm sm:text-base placeholder-slate-500 font-mono"
                                    placeholder="https://sua-aplicacao.com/api">
                            </div>
                            <button onclick="handleStartScan()" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold text-sm transition shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-radar"></i> Analisar Alvo
                            </button>
                        </div>
                        <p class="text-xs text-slate-500 mt-3 font-mono">💡 Dica TCC: Utilize o ambiente controlado <span class="text-indigo-400 cursor-pointer underline" onclick="navigateTo('lab')">SentinelLab</span> para testes seguros.</p>
                    </div>

                    <!-- Core Pillars / Architecture Highlights -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
                        <div class="glass-card p-6 rounded-2xl border border-slate-800">
                            <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xl mb-4 border border-indigo-500/20">
                                <i class="fa-solid fa-network-wired"></i>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-2">Security Orchestrator</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">Executa varreduras automatizadas DAST, SAST e análise de dependências (SCA) em infraestrutura cloud distribuída.</p>
                        </div>

                        <div class="glass-card p-6 rounded-2xl border border-slate-800">
                            <div class="w-12 h-12 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-xl mb-4 border border-cyan-500/20">
                                <i class="fa-solid fa-brain"></i>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-2">AI Security Explainer</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">Utiliza RAG (Retrieval-Augmented Generation) com base de conhecimento OWASP para gerar explicações didáticas em 3 níveis.</p>
                        </div>

                        <div class="glass-card p-6 rounded-2xl border border-slate-800">
                            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl mb-4 border border-emerald-500/20">
                                <i class="fa-solid fa-chart-line"></i>
                            </div>
                            <h3 class="text-lg font-bold text-white mb-2">Security Score & Fix Plan</h3>
                            <p class="text-slate-400 text-sm leading-relaxed">Mensure a evolução da segurança da aplicação em tempo real com o Security Score e planos de remediação com código.</p>
                        </div>
                    </div>

                    <!-- CTA Banner for TCC Presentation -->
                    <div class="glass-panel p-8 rounded-2xl border-indigo-500/30 flex flex-col md:flex-row items-center justify-between gap-6 bg-gradient-to-r from-indigo-950/40 to-slate-900/60">
                        <div>
                            <h3 class="text-2xl font-bold text-white mb-2">Pronto para testar a demonstração interativa?</h3>
                            <p class="text-slate-300 text-sm max-w-xl">Veja como o SentinelAI transforma alertas brutos de scanners em diagnósticos claros e aplica correções automáticas.</p>
                        </div>
                        <button onclick="openDemoScan()" class="px-6 py-3 rounded-xl bg-white text-slate-900 font-bold hover:bg-slate-200 transition shadow-lg flex items-center gap-2 text-sm whitespace-nowrap">
                            <i class="fa-solid fa-play text-indigo-600"></i> Executar Demonstração
                        </button>
                    </div>
                </div>
            `;
        }

        // --- VIEW 2 & 3: TERMINAL / SCANNING / FIXING SIMULATOR ---
        function renderTerminalView(title, iconClass, logsArray) {
            return `
                <div class="max-w-3xl mx-auto pt-16 animate-fade-in text-center">
                    <div class="relative w-28 h-28 mx-auto mb-8">
                        <div class="absolute inset-0 border-4 border-slate-800 rounded-full"></div>
                        <div class="absolute inset-0 border-4 border-indigo-500 rounded-full border-t-transparent animate-spin"></div>
                        <div class="absolute inset-0 flex items-center justify-center text-3xl">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">${title}</h2>
                    <p class="text-slate-400 font-mono text-sm mb-8">${state.targetUrl}</p>

                    <div class="glass-panel text-left w-full h-72 rounded-2xl p-6 overflow-y-auto border-slate-800 shadow-2xl flex flex-col justify-between">
                        <div id="terminal-log-output" class="terminal-text text-xs sm:text-sm space-y-2">
                            ${logsArray.map(log => `<div><span class="text-slate-500">[${log.time}]</span> <span class="${log.color || 'text-slate-300'}">${log.text}</span></div>`).join('')}
                        </div>
                        <div class="pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-500 font-mono">
                            <span>Status: Processing Cloud Pipeline...</span>
                            <span class="animate-pulse text-indigo-400">● Live Stream</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleStartScan() {
            const input = document.getElementById('home-url-input');
            if (input && input.value) {
                state.targetUrl = input.value;
            }
            state.isFixed = false;
            state.currentView = 'scanning';
            state.scanLogs = [];
            render();
            runScanSimulation();
        }

        function runScanSimulation() {
            const steps = [
                { text: 'Conectando ao SentinelAI Security Orchestrator (AWS Lambda)...', color: 'text-indigo-400' },
                { text: 'Validando autorização do alvo e escopo do SentinelLab...', color: 'text-slate-300' },
                { text: 'Executando DAST Scanner (OWASP ZAP Engine v2.14)...', color: 'text-cyan-400' },
                { text: 'Alerta Detectado: SQL Injection em /api/v1/auth/login (High Severity)', color: 'text-red-400' },
                { text: 'Alerta Detectado: Stored XSS em /dashboard/profile/bio (Medium Severity)', color: 'text-amber-400' },
                { text: 'Executando SAST Analyzer & SCA Package Checker...', color: 'text-cyan-400' },
                { text: 'Enviando contexto bruto para IA Security Engine (RAG + LLM)...', color: 'text-purple-400' },
                { text: 'Gerando explicações em 3 níveis e plano de correção estruturado...', color: 'text-emerald-400' },
                { text: 'Análise concluída com sucesso! Redirecionando para o Dashboard...', color: 'text-emerald-400 font-bold' }
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < steps.length) {
                    const time = new Date().toLocaleTimeString();
                    state.scanLogs.push({ time, ...steps[i] });
                    render();
                    const container = document.getElementById('terminal-log-output');
                    if (container) container.scrollTop = container.scrollHeight;
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        state.currentView = 'dashboard';
                        render();
                    }, 1000);
                }
            }, 600);
        }

        function runFixSimulation() {
            const steps = [
                { text: 'Iniciando pipeline de Auto-Remediation na nuvem...', color: 'text-indigo-400' },
                { text: 'Refatorando código Java/Python: substituindo concatenação por Prepared Statements...', color: 'text-emerald-400' },
                { text: 'Aplicando DOMPurify e sanitização estrita para vulnerabilidades XSS...', color: 'text-emerald-400' },
                { text: 'Configurando Helmet middleware e cabeçalhos de segurança HTTP (CSP, HSTS)...', color: 'text-emerald-400' },
                { text: 'Atualizando dependência vulnerável lodash@4.17.15 para lodash@4.17.21...', color: 'text-emerald-400' },
                { text: 'Executando Verify-Scan automatizado nos endpoints corrigidos...', color: 'text-cyan-400' },
                { text: 'Verify-Scan concluído: Zero vulnerabilidades remanescentes.', color: 'text-emerald-400 font-bold' },
                { text: 'Atualizando Security Score de 74 para 99/100 (SECURE STATE)...', color: 'text-emerald-400 font-bold' }
            ];

            let i = 0;
            const interval = setInterval(() => {
                if (i < steps.length) {
                    const time = new Date().toLocaleTimeString();
                    state.fixLogs.push({ time, ...steps[i] });
                    render();
                    const container = document.getElementById('terminal-log-output');
                    if (container) container.scrollTop = container.scrollHeight;
                    i++;
                } else {
                    clearInterval(interval);
                    setTimeout(() => {
                        state.isFixed = true;
                        state.currentView = 'dashboard';
                        render();
                    }, 1200);
                }
            }, 550);
        }

        function triggerApplyFixPlan() {
            state.currentView = 'fixing';
            state.fixLogs = [];
            render();
            runFixSimulation();
        }

        function triggerResetDemo() {
            state.isFixed = false;
            state.currentView = 'dashboard';
            render();
        }

        // --- VIEW 4: INTERACTIVE DASHBOARD ---
        function renderDashboardView() {
            const score = state.isFixed ? 99 : 74;
            const scoreColor = state.isFixed ? 'text-emerald-400' : 'text-amber-400';
            const scoreBgBorder = state.isFixed ? 'border-emerald-500/30 bg-emerald-500/10' : 'border-amber-500/30 bg-amber-500/10';
            const scoreLabel = state.isFixed ? 'SECURE STATE (LOW RISK)' : 'MODERATE RISK DETECTED';

            const activeVuln = vulnerabilitiesData.find(v => v.id === state.selectedVulnId) || vulnerabilitiesData[0];

            return `
                <div class="max-w-7xl mx-auto animate-fade-in pb-12">
                    <!-- Top Status Banner if Fixed -->
                    ${state.isFixed ? `
                        <div class="mb-6 p-4 rounded-2xl glass-panel border-emerald-500/40 bg-emerald-950/20 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg border border-emerald-500/30">
                                    <i class="fa-solid fa-shield-check"></i>
                                </div>
                                <div>
                                    <h4 class="text-white font-bold text-sm">Plataforma em Estado Seguro</h4>
                                    <p class="text-slate-300 text-xs">Todas as vulnerabilidades foram mitigadas com sucesso pelo SentinelAI Fix Plan.</p>
                                </div>
                            </div>
                            <button onclick="triggerResetDemo()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Simular Novo Ataque
                            </button>
                        </div>
                    ` : ''}

                    <!-- Dashboard Header -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-1">Painel de Análise de Segurança</h1>
                            <div class="flex items-center gap-3 text-xs sm:text-sm text-slate-400 font-mono">
                                <span><i class="fa-solid fa-bullseye text-indigo-400 mr-1.5"></i> Target: ${state.targetUrl}</span>
                                <span>•</span>
                                <span><i class="fa-solid fa-clock text-slate-500 mr-1.5"></i> Último Scan: Há 2 min</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto">
                            ${!state.isFixed ? `

            setTimeout(() => {
